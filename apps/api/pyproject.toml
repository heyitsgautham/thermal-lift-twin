[project]
name = "thermal-lift-twin-api"
version = "0.2.0"
description = "FastAPI service for the Thermal Lift Twin: wells, cycles, telemetry, schedules and the generator repair."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyarrow>=17",
  "prometheus-client>=0.26",
  "sentry-sdk>=2.73",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "httpx>=0.27",
  "ruff>=0.14",
  "mypy>=1.18",
]

[tool.uv]
# A service, not a library: uv installs the dependencies and runs from source.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`"]

[tool.coverage.run]
source = ["twin_api"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["twin_api"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# pyarrow ships no type information of its own.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
